[package]
name = "rigbat"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "System tray battery monitor for gaming peripherals"
license = "MIT"
repository = "https://github.com/Skesov/rigbat"

[dependencies]
async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
ksni = { version = "0.3.4", features = ["tokio"] }
tiny-skia = "0.11"
ashpd = { version = "0.13.11", default-features = false, features = ["tokio", "settings"] }
futures-util = { version = "0.3", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }
nix = { version = "0.29", default-features = false, features = ["poll"] }
notify = "8"
