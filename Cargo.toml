[package]
name = "rigbat"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "System tray battery monitor for gaming peripherals"
license = "MIT"
repository = "https://github.com/Skesov/rigbat"

[dependencies]
async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
