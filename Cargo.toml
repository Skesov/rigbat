[package]
name = "rigbat"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "System tray battery monitor for gaming peripherals"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Skesov/rigbat"
homepage = "https://github.com/Skesov/rigbat"
readme = "README.md"
keywords = ["battery", "tray", "peripherals", "bluetooth", "hid"]
categories = ["command-line-utilities", "os::linux-apis", "gui"]
# The packaged crate is what `cargo install rigbat` builds from; CI
# configuration and agent instructions are not part of that.
exclude = [".github/", "CLAUDE.md", "release-please-config.json", ".release-please-manifest.json"]

[dependencies]
async-trait = "0.1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
ksni = { version = "0.3.6", features = ["tokio"] }
tiny-skia = "0.11"
ashpd = { version = "0.13.11", default-features = false, features = ["tokio", "settings"] }
futures-util = { version = "0.3", default-features = false }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
nix = { version = "0.31", default-features = false, features = ["fs", "poll"] }
notify = "8"
# bundled compiles SQLite from source and links it statically: no runtime
# libsqlite3 dependency, cargo build stays self-contained. Needs a C
# compiler at build time — see CONTRIBUTING.md.
rusqlite = { version = "0.40", features = ["bundled"] }
# accesskit exports both windows to screen readers over AT-SPI. Its bridge
# (accesskit_unix) runs its zbus connections on a thread of its own, with no
# tokio runtime, and turns on zbus's `async-io` backend next to our `tokio`.
# zbus >= 5.19 picks the backend per thread (tokio only where a runtime is
# current), so that thread gets async-io; older zbus forced tokio there and
# panicked with "no reactor running". Hence the 5.19 floor on zbus above.
eframe = { version = "0.34.3", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Pinned to exactly eframe's egui version (0.34.3): egui_extras must match
# eframe's egui build-for-build, or the two link two different, incompatible
# `egui` crates. `cargo tree -i egui` confirms a single 0.34.3 in the graph.
egui_extras = { version = "=0.34.3", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
# UI translations (R60): embedded Fluent catalogues from i18n/.
i18n-embed = { version = "0.16", default-features = false, features = ["fluent-system", "rust-embed"] }
i18n-embed-fl = "0.10"
rust-embed = "8"
unic-langid = { version = "0.9", features = ["macros"] }

[dev-dependencies]
# Catalogue syntax check in i18n::tests.
fluent-syntax = "0.12"
# Property tests for the byte-level parsers in sources::*.
proptest = "1"
# Parses src/ for the module dependency rules in tests/architecture.rs.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# Paused clock for timer-driven loops (supervisor sweep cadence).
tokio = { version = "1", features = ["test-util"] }

# target/packaging/rigbat.service (ExecStart=/usr/bin/rigbat tray) is generated by release.yml.
[package.metadata.deb]
maintainer = "Vladimir Skesov <skesov@gmail.com>"
section = "utils"
# Without it cargo-deb pastes the whole README into the control file.
extended-description = """\
Shows the charge of mice, keyboards, headsets and controllers in the system \
tray, read from sysfs, BlueZ and vendor HID protocols."""
assets = [
    ["target/release/rigbat", "usr/bin/", "755"],
    ["packaging/70-rigbat.rules", "usr/lib/udev/rules.d/", "644"],
    ["target/packaging/rigbat.service", "usr/lib/systemd/user/", "644"],
    ["packaging/rigbat.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/hicolor/scalable/apps/rigbat.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["LICENSE-MIT", "usr/share/doc/rigbat/", "644"],
    ["LICENSE-APACHE", "usr/share/doc/rigbat/", "644"],
    ["README.md", "usr/share/doc/rigbat/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/rigbat", dest = "/usr/bin/rigbat", mode = "755" },
    { source = "packaging/70-rigbat.rules", dest = "/usr/lib/udev/rules.d/70-rigbat.rules", mode = "644" },
    { source = "target/packaging/rigbat.service", dest = "/usr/lib/systemd/user/rigbat.service", mode = "644" },
    { source = "packaging/rigbat.desktop", dest = "/usr/share/applications/rigbat.desktop", mode = "644" },
    { source = "packaging/icons/hicolor/scalable/apps/rigbat.svg", dest = "/usr/share/icons/hicolor/scalable/apps/rigbat.svg", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/rigbat/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/rigbat/LICENSE-APACHE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/rigbat/README.md", mode = "644", doc = true },
]

[lints.rust]
unsafe_code = "forbid"

# pedantic/nursery are deliberately not enabled: they produce ~190 diagnostics
# on this codebase, ~50 of which are u32->f32 casts inherent to the icon
# geometry and 31 are missing backticks in doc comments — noise that would
# bury real findings, not a signal this project is missing.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
# Denies `#[allow]`, so a suppression must be `#[expect]` — which clippy
# reports when it stops being needed. An `allow` that outlives its reason is
# invisible; an unfulfilled `expect` fails the gate.
allow_attributes = "deny"
# indexing_slicing evaluated and rejected: measured at 125 diagnostics across
# icon.rs's geometry/glyph tables plus routine slice indexing in nearly every
# test module, and clippy has no allow-in-tests config for it (unlike
# unwrap_used/expect_used) — enabling it would mean scattering #[allow] over
# most of the codebase, the exact anti-pattern this file avoids for pedantic.

[profile.release]
lto = true
codegen-units = 1
strip = true
# panic = "abort" is intentionally NOT set: T23 added crashed-task detection
# that keeps the daemon alive and respawns a panicked source task; aborting
# the whole process on any panic would discard that recovery.
