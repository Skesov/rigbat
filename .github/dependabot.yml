version: 2

updates:
  # Rust dependencies. Grouped so a quiet week produces one pull request
  # instead of eight: every gate runs per pull request, and reviewing eight
  # one-line bumps costs more attention than it protects.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # `chore(deps)` is a conventional-commit type release-please keeps out of
    # the changelog — a dependency bump is not a user-facing change. A bump
    # that fixes something a user would notice gets a hand-written `fix:`
    # commit instead.
    commit-message:
      prefix: "chore(deps)"
    groups:
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Major bumps arrive as their own pull requests: they need a human to read
    # the changelog.
    #
    # eframe and egui_extras are excluded from anything but a patch bump, and
    # proved it on the first run: Dependabot's eframe 0.34 -> 0.36 pull request
    # failed with `eframe::egui::Button` not satisfying `egui::widgets::Widget`
    # — two egui versions in one graph. `egui_extras` is pinned to eframe's
    # exact egui build by hand, so the two only move together, and which
    # version matches is something a human reads off eframe's release notes.
    ignore:
      - dependency-name: "eframe"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "egui_extras"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  # The actions used by ci.yml and release.yml. Pinned action versions rot the
  # same way crate versions do, and a stale checkout or toolchain action is how
  # a green pipeline stops testing what it claims to.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
