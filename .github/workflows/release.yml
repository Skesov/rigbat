name: release

on:
  push:
    branches: [master]
  # Rebuilds the artifacts of a release that already exists, e.g. after the
  # artifacts job failed on the push that created it.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.2.0
        required: true

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Keeps a release pull request in sync with the conventional commits on
  # master: it bumps the version in Cargo.toml and Cargo.lock and writes
  # CHANGELOG.md. Merging that PR is what creates the tag and the release —
  # nothing here releases on its own.
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Configuration lives in release-please-config.json and
          # .release-please-manifest.json so the version rigbat is at is
          # readable in the repository rather than in workflow inputs.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the artifacts only once a release exists to attach them to. The
  # shape follows ripgrep and fd: per target a bare binary, a tarball with the
  # files a user needs to install it, .deb and .rpm, and a checksum beside each.
  # Native runners per architecture (no cross image with X11/Wayland headers);
  # Ubuntu 22.04 keeps the glibc floor at 2.35 so the binary runs on older
  # distributions than the build host.
  artifacts:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            deb_arch: amd64
            rpm_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    # Replaces the workflow-level permissions for this job.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      # The bare binary is for users who manage the udev rule and the service
      # themselves; the tarball carries what `make install` would place — the
      # udev rule a USB HID device needs, the desktop entry, the systemd user
      # unit and the icon.
      - name: Stage the binary and the tarball
        id: stage
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="rigbat-v${version}-${TARGET}"
          strip "target/${TARGET}/release/rigbat" || true
          cp "target/${TARGET}/release/rigbat" "${name}"
          sha256sum "${name}" > "${name}.sha256"
          staging="$(mktemp -d)/${name}"
          mkdir -p "${staging}"
          cp "target/${TARGET}/release/rigbat" "${staging}/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "${staging}/"
          cp -r packaging "${staging}/"
          tar czf "${name}.tar.gz" -C "$(dirname "${staging}")" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "binary=${name}" >> "$GITHUB_OUTPUT"
          echo "asset=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      # The shipped unit points at ~/.cargo/bin for `make service`; the
      # packages install the binary to /usr/bin.
      - name: Build the packages
        id: packages
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p target/packaging
          sed 's|^ExecStart=.*rigbat tray$|ExecStart=/usr/bin/rigbat tray|' \
            packaging/rigbat.service > target/packaging/rigbat.service
          grep -qx 'ExecStart=/usr/bin/rigbat tray' target/packaging/rigbat.service
          deb="rigbat_${version}-1_${{ matrix.deb_arch }}.deb"
          rpm="rigbat-${version}-1.${{ matrix.rpm_arch }}.rpm"
          cargo deb --no-build --target "$TARGET" --output "${deb}"
          cargo generate-rpm --target "$TARGET" --output "${rpm}"
          sha256sum "${deb}" > "${deb}.sha256"
          sha256sum "${rpm}" > "${rpm}.sha256"
          echo "deb=${deb}" >> "$GITHUB_OUTPUT"
          echo "rpm=${rpm}" >> "$GITHUB_OUTPUT"

      # GitHub stores attestations only for public repositories (and
      # organisation-owned private ones); on a user-owned private repository
      # the step fails the whole release.
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            ${{ steps.stage.outputs.binary }}
            ${{ steps.stage.outputs.asset }}
            ${{ steps.packages.outputs.deb }}
            ${{ steps.packages.outputs.rpm }}

      - name: Attach to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            "${{ steps.stage.outputs.binary }}" \
            "${{ steps.stage.outputs.binary }}.sha256" \
            "${{ steps.stage.outputs.asset }}" \
            "${{ steps.stage.outputs.asset }}.sha256" \
            "${{ steps.packages.outputs.deb }}" \
            "${{ steps.packages.outputs.deb }}.sha256" \
            "${{ steps.packages.outputs.rpm }}" \
            "${{ steps.packages.outputs.rpm }}.sha256" \
            --clobber
