name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Keeps a release pull request in sync with the conventional commits on
  # master: it bumps the version in Cargo.toml and Cargo.lock and writes
  # CHANGELOG.md. Merging that PR is what creates the tag and the release —
  # nothing here releases on its own.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Configuration lives in release-please-config.json and
          # .release-please-manifest.json so the version rigbat is at is
          # readable in the repository rather than in workflow inputs.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the artifacts only once a release exists to attach them to. The
  # shape follows ripgrep and fd: one tarball per target, the binary plus the
  # files a user needs to install it, and a checksum beside each.
  artifacts:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # One target for now. A cross-built aarch64 leg needs the X11/Wayland
    # headers inside the cross image, and a matrix leg that fails on every
    # release is worse than a target nobody has asked for yet.
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      # The tarball carries what `make install` would place: the binary, the
      # udev rule a USB HID device needs, the desktop entry, the systemd user
      # unit and the icon. Without them a user who skips the repository has a
      # binary that cannot see half their hardware.
      - name: Stage the tarball
        id: stage
        run: |
          set -euo pipefail
          version="${{ needs.release-please.outputs.version }}"
          name="rigbat-v${version}-${TARGET}"
          staging="$(mktemp -d)/${name}"
          mkdir -p "${staging}"
          cp "target/${TARGET}/release/rigbat" "${staging}/"
          strip "${staging}/rigbat" || true
          cp README.md CHANGELOG.md "${staging}/"
          if [ -f LICENSE ]; then cp LICENSE "${staging}/"; fi
          cp -r packaging "${staging}/"
          tar czf "${name}.tar.gz" -C "$(dirname "${staging}")" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "asset=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "${{ steps.stage.outputs.asset }}" \
            "${{ steps.stage.outputs.asset }}.sha256" \
            --clobber
