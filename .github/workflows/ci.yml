name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # winit and glow reach X11, Wayland, xkbcommon and GL through dlopen at
      # runtime, but their build scripts still need the development headers.
      # rusqlite's `bundled` feature compiles SQLite, which needs the C
      # toolchain the runner already has.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev pkg-config

      # rust-toolchain.toml pins the channel; this action honours it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The same four gates CONTRIBUTING.md and `make gates` name, in the same
      # order, so a contributor sees locally what CI will say.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo build --locked
      - run: cargo test --locked

  msrv:
    name: msrv (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep in step with `rust-version` in Cargo.toml.
        rust: ["1.96"]
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # `check`, not `test`: the claim being verified is that the crate still
      # compiles on the oldest supported compiler.
      - run: cargo check --locked --all-targets
